; ESP32 actuator controller for the auto-aiming trashcan.
; Receives commands from the UNO Q over serial, drives the L298N wheels and
; the lid servo on GPIO 17. See src/main.cpp for the protocol.
;
; Custom audio clips live in data/ as 16-bit mono PCM WAV files and are
; uploaded separately from the firmware:
;   pio run -t uploadfs --upload-port COM6

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5

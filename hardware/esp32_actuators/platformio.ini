; ESP32 actuator controller for the auto-aiming trashcan.
; Receives commands from the UNO Q over serial, drives the L298N wheels and
; the lid servo on GPIO 16. See src/main.cpp for the protocol.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
